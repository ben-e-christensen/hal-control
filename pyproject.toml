[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hal-control"
version = "0.1.0"
description = "Desktop control for a SonicSurface 16x16 ultrasonic phased array"
requires-python = ">=3.10"
dependencies = ["numpy", "pyserial", "PySide6", "pyqtgraph"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["hal_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
